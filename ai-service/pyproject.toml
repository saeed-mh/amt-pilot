[project]
name = "amtpilot-ai-service"
version = "0.1.0"
description = "AI document analysis service for AmtPilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-google-genai",
    "pydantic-settings",
    "python-multipart",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100