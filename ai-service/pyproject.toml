[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amtpilot-ai-service"
version = "0.1.0"
description = "AI document analysis service for AmtPilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-google-genai",
    "pydantic-settings",
    "python-multipart",
    "pypdf",
    "ocrmypdf",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*", "evals", "evals.*"]

[tool.setuptools.package-data]
evals = ["datasets/*.json"]

[tool.ruff]
line-length = 100
