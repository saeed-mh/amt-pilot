name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install AI-service dependencies
        working-directory: ai-service
        run: python -m pip install -e ".[dev]"

      - name: Lint AI service
        working-directory: ai-service
        run: ruff check app tests evals

      - name: Test AI service
        working-directory: ai-service
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Verify lint produced no changes
        working-directory: frontend
        run: git diff --exit-code -- .

      - name: Build frontend
        working-directory: frontend
        run: npm run build
