services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amtpilot}
      POSTGRES_USER: ${POSTGRES_USER:-amtpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amtpilot}
    ports:
      - "5432:5432"
    volumes:
      - amtpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amtpilot-postgres-data:
